name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    name: API (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  docker-build:
    name: Docker-Images bauen (ohne Push)
    runs-on: ubuntu-latest
    needs: [frontend, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Frontend-Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: API-Image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  docker-push:
    name: Docker Hub Push (nur main, nur mit Secrets)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      # Secrets lassen sich nicht in `if:` auf Job-Ebene abfragen, daher hier prüfen.
      # Fehlen sie, werden alle folgenden Schritte übersprungen und der Job bleibt grün.
      - name: Secrets prüfen
        id: secrets
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN nicht gesetzt, Push wird übersprungen."
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.enabled == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.secrets.outputs.enabled == 'true'
      - uses: docker/login-action@v3
        if: steps.secrets.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Frontend-Image pushen
        if: steps.secrets.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/specimenone:latest
          cache-from: type=gha,scope=frontend
      - name: API-Image pushen
        if: steps.secrets.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/specimenone-api:latest
          cache-from: type=gha,scope=api
