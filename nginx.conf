server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;  # Akzeptiert alle Hostnamen

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Sicherheitsheader. Achtung: add_header in einer location ersetzt die
    # Header der server-Ebene, deshalb stehen sie unten in jeder location erneut.
    # Keine CSP: index.html lädt das Cloudflare-Insights-Beacon, das Cloudflare
    # zusätzlich selbst einfügen kann; eine unpassende CSP würde App oder
    # Analytics still brechen.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Dateien ohne Hash im Namen: immer beim Server nachfragen, damit
    # PWA-Updates (sw.js) und die Runtime-Config sofort ankommen.
    location ~ ^/(index\.html|sw\.js|config\.js|registerSW\.js|manifest\.webmanifest|manifest\.json)$ {
        # nginx kennt .webmanifest nicht; gilt nur für Endungen ohne eigenen MIME-Typ
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # Vite-Assets mit Hash im Dateinamen: dauerhaft cachen.
    # ^~ verhindert, dass die Bild-/Font-Regel unten greift.
    # Fehlende Chunks liefern 404 statt index.html.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # Bilder und Fonts aus public/ (ohne Hash im Namen): 30 Tage
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # API-Proxy zum Backend-Container (Service-Name "api" im Compose-Stack).
    # Resolver + Variable: nginx startet auch, wenn der api-Container (noch) fehlt.
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # helmet setzt diese Header auch; so gelten die nginx-Werte ohne Dubletten
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
    }

    # SPA-Konfiguration: alle nicht-existierenden Pfade zu index.html umleiten
    # (der interne Sprung auf /index.html bekommt oben "no-cache")
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip-Kompression aktivieren
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1000;
}
