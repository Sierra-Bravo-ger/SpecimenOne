server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;  # Akzeptiert alle Hostnamen
    
    root /usr/share/nginx/html;
    index index.html;

    # Caching-Einstellungen für statische Dateien
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    
    # Korrekte MIME-Typen für JavaScript-Module
    location ~* \.(js|mjs|jsx)$ {
        types {
            application/javascript js mjs jsx;
        }
    }
    
    # API-Proxy zum Backend-Container (Service-Name "api" im Compose-Stack).
    # Resolver + Variable: nginx startet auch, wenn der api-Container (noch) fehlt.
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA-Konfiguration: alle nicht-existierenden Pfade zu index.html umleiten
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip-Kompression aktivieren
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;
}
