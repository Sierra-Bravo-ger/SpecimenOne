# Produktiv-Stack (styx): Frontend (nginx) + REST-API + PostgreSQL
# Das Frontend leitet /api/* an den Service "api" weiter (siehe nginx.conf).
services:
  specimenone:
    image: madmoench/specimenone:latest
    ports:
      - 8100:80
    restart: unless-stopped
    depends_on:
      - api
    # environment:
    #   - VITE_DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/...
    volumes:
      - /home/sebri/specimenone/tests.json:/usr/share/nginx/html/tests.json
      - /home/sebri/specimenone/profile.json:/usr/share/nginx/html/profile.json
      - /home/sebri/specimenone/referenzwerte.json:/usr/share/nginx/html/referenzwerte.json
      - /home/sebri/specimenone/material.json:/usr/share/nginx/html/material.json
      - /home/sebri/specimenone/einheiten.json:/usr/share/nginx/html/einheiten.json
  api:
    image: madmoench/specimenone-api:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=specimen
      - PGPASSWORD=specimenpw
      - PGDATABASE=specimenone
  postgres:
    container_name: specimenone-postgresql-db
    image: postgres:17.5-alpine3.21
    ports:
      - 5433:5432
    restart: unless-stopped
    volumes:
      - /home/sebri/postgresql/:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=specimenpw
      - POSTGRES_USER=specimen
      - POSTGRES_DB=specimenone
networks: {}
